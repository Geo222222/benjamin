name: Constitutional CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    name: kernel-py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install kernel
        run: python -m pip install -e '.[dev]'
      - name: Test covenant and Capital State invariants
        run: python -m pytest -q

  consoles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install console dependencies
        run: npm install --no-audit --no-fund
      - name: Build manager and client consoles
        run: npm run build:consoles
