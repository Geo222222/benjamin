name: Deploy Benjamin Public Site

on:
  push:
    branches:
      - main
      - codex/public-institution-site
    paths:
      - 'site/**'
      - 'apps/manager-console/**'
      - 'apps/client-console/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install console dependencies
        run: npm install --no-audit --no-fund

      - name: Build Benjamin Command and client demo
        run: npm run build:consoles

      - name: Assemble Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/demo/command _site/demo/client
          cp -R site/. _site/
          cp -R apps/manager-console/dist/. _site/demo/command/
          cp -R apps/client-console/dist/. _site/demo/client/

      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Benjamin Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
