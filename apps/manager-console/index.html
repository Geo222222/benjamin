<!doctype html>
<html lang="en" data-theme="matrix">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Benjamin Command — Epinnox owner and manager operating experience" />
    <meta name="theme-color" content="#020806" />
    <title>Benjamin Command — Owner / Manager</title>
    <script>
      (() => {
        const saved = localStorage.getItem('benjamin-demo-theme');
        const theme = saved === 'light' ? 'light' : 'matrix';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'light' ? '#eef3fa' : '#020806');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
