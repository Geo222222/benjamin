<!doctype html>
<html lang="en" data-theme="matrix">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Benjamin Command — Epinnox owner and manager operating experience" />
    <meta name="theme-color" content="#020806" />
    <title>Benjamin Command — Owner / Manager</title>
    <script>
      (() => {
        const key = 'benjamin-demo-theme';
        const saved = localStorage.getItem(key);
        document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'matrix';
        const paint = (theme) => {
          document.documentElement.dataset.theme = theme;
          localStorage.setItem(key, theme);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#eef3fa' : '#020806');
          document.querySelectorAll('[data-theme-choice]').forEach((button) => {
            button.classList.toggle('active', button.dataset.themeChoice === theme);
          });
        };
        window.addEventListener('DOMContentLoaded', () => {
          const control = document.createElement('div');
          control.className = 'theme-control';
          control.setAttribute('aria-label', 'Theme selection');
          control.innerHTML = '<span>Theme</span><button type="button" data-theme-choice="matrix">Matrix</button><button type="button" data-theme-choice="light">Blue / White</button>';
          control.addEventListener('click', (event) => {
            const button = event.target.closest('[data-theme-choice]');
            if (button) paint(button.dataset.themeChoice);
          });
          document.body.appendChild(control);
          paint(document.documentElement.dataset.theme === 'light' ? 'light' : 'matrix');
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
